[package]
name = "vetis-rev-proxy"
version = "0.1.0-beta.1"
edition = "2024"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
repository = "https://github.com/vetis-server/vetis-rev-proxy"
homepage = "https://github.com/vetis-server/vetis"
description = "Very Tiny Server Reverse Proxy support"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["http", "modules", "server", "rest-server"]
publish = true
rust-version = "1.85.0"

[features]
default = ["runtime-tokio"]
runtime-tokio = ["dep:deboa-tokio", "dep:vetis-tokio"]

[dependencies]
deboa = { version = "0.1.5-beta.3" }
deboa-tokio = { version = "0.1.4-beta.3", optional = true }
http = "1.5.0"
http-body-util = "0.1.5"
once_cell = "1.21.4"
serde = { version = "1.0.228", features = ["derive"] }
typetag = "0.2.21"
vetis = { version = "0.1.7-beta.5" }
vetis-tokio = { version = "0.1.2-beta.6", optional = true }

[dev-dependencies]
caramelo = "0.1.5"
tokio = { version = "1.53.1", default-features = false, features = ["macros"] }
